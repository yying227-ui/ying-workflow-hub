name: fx-daily

# Pilot: daily AUD exchange-rate snapshot, committed back to this repo.
# 22:17 UTC = 09:17 Sydney (AEDT) / 08:17 Sydney (AEST).
on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_fx.py"
      - ".github/workflows/fx-daily.yml"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AUD rates
        run: python3 scripts/fetch_fx.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fx-history.csv data/fx-latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fx: daily AUD snapshot $(date -u +%F)"
            git push
          fi
